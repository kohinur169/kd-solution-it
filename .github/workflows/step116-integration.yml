name: STEP 116 isolated integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      TEST_USER_A_EMAIL: ${{ secrets.SUPABASE_TEST_USER_A_EMAIL }}
      TEST_USER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_A_PASSWORD }}
      TEST_USER_B_EMAIL: ${{ secrets.SUPABASE_TEST_USER_B_EMAIL }}
      TEST_USER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_B_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Project-এ যেই runtime/package manager ব্যবহৃত, সেটি অনুযায়ী setup ও install।

      - name: Apply migrations to the disposable test project
        run: <repository-র যাচাইকৃত migration command>

      - name: Run authenticated integration tests
        run: <repository-র যাচাইকৃত integration test command>
